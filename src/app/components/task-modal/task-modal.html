<div class="modal-overlay" (click)="fechar.emit()">
  <div class="modal" (click)="$event.stopPropagation()">

    <div class="modal__header">
      <div class="modal__radio" [class.modal__radio--done]="status === 'DONE'"></div>
      <input class="modal__name" [(ngModel)]="nome" placeholder="Nome da tarefa" />
      <button class="modal__close" (click)="fechar.emit()" aria-label="Fechar">×</button>
    </div>

    <div class="modal__body">
      <div class="modal__row">
        <label class="modal__field">
          <span class="modal__field-label">Status</span>
          <select class="modal__input" [(ngModel)]="status">
            <option value="BACKLOG">Backlog</option>
            <option value="TODO">To-do</option>
            <option value="DOING">Doing</option>
            <option value="DONE">Done</option>
          </select>
        </label>
        <label class="modal__field modal__field--small">
          <span class="modal__field-label">Prioridade</span>
          <select class="modal__input" [(ngModel)]="prioridade">
            <option [ngValue]="1">1</option>
            <option [ngValue]="2">2</option>
            <option [ngValue]="3">3</option>
            <option [ngValue]="4">4</option>
            <option [ngValue]="5">5</option>
          </select>
        </label>
      </div>

      <div class="modal__row">
        <label class="modal__field">
          <span class="modal__field-label">Categoria</span>
          <input class="modal__input" [(ngModel)]="categoria" />
        </label>
        <label class="modal__field">
          <span class="modal__field-label">Data limite</span>
          <input class="modal__input" type="date" [(ngModel)]="dataLimite" />
        </label>
      </div>

      <div class="modal__desc">
        <span class="modal__field-label">Descrição</span>
        <textarea class="modal__input modal__textarea" [(ngModel)]="descricao" rows="3"></textarea>
      </div>
    </div>

    <div class="modal__actions">
      @if (confirmandoExclusao) {
        <span class="modal__confirm-text">Excluir esta tarefa?</span>
        <button class="modal__btn modal__btn--cancel" (click)="cancelarExclusao()">Não</button>
        <button class="modal__btn modal__btn--delete-confirm" (click)="deletar.emit()">Sim, excluir</button>
      } @else {
        @if (editando) {
          <button class="modal__btn modal__btn--delete" (click)="pedirConfirmacao()">Deletar</button>
        }
        <button class="modal__btn modal__btn--cancel" (click)="fechar.emit()">Cancelar</button>
        <button class="modal__btn modal__btn--save" (click)="aoSalvar()">Salvar</button>
      }
    </div>

  </div>
</div>
