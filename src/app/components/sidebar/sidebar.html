<aside class="sidebar">
  <div class="sidebar__header">
    <div class="sidebar__logo">ZG</div>
    <div>
      <p class="sidebar__title">ZG hero</p>
      <p class="sidebar__subtitle">Projeto pessoal</p>
    </div>
  </div>

  <nav class="sidebar__workspaces">
    <p class="sidebar__section-label">Workspaces</p>

    @for (ws of workspaces(); track ws.id) {
      <button class="workspace"
              [class.workspace--active]="ws.id === workspaceAtivoId()"
              (click)="selecionar(ws.id)">
        {{ ws.nome }}
      </button>
    }

    @if (criandoWorkspace()) {
      <input class="workspace__input"
             [(ngModel)]="nomeNovoWorkspace"
             (keyup.enter)="confirmarCriacao()"
             (blur)="confirmarCriacao()"
             placeholder="Nome do workspace" />
    } @else {
      <button class="workspace workspace--new" (click)="abrirCriacao()">+ Novo</button>
    }
  </nav>
</aside>
