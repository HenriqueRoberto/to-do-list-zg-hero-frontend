<main class="board">
  <div class="board__toolbar">
    <div class="board__search">
      <input type="text" placeholder="Buscar tarefa..." />
    </div>
    <button class="board__filter">Status</button>
    <button class="board__filter">Categoria</button>
    <button class="board__filter">Prioridade</button>
    <button class="board__filter">Data</button>
    <button class="board__new-task">+ Nova tarefa</button>
  </div>

  <div class="board__columns">
    <app-column title="Backlog" color="var(--col-backlog)" [tasks]="backlog()" (avancarTask)="avancarStatus($event)" />
    <app-column title="To-do" color="var(--col-todo)" [tasks]="todo()" (avancarTask)="avancarStatus($event)" />
    <app-column title="Doing" color="var(--col-doing)" [tasks]="doing()" (avancarTask)="avancarStatus($event)" />
    <app-column title="Done" color="var(--col-done)" [tasks]="done()" (avancarTask)="avancarStatus($event)" />
  </div>
</main>
