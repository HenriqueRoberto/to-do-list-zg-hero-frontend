<section class="column">
  <header class="column__header" [style.background]="color()">
    <span class="column__title">{{ title() }}</span>
    <span class="column__count">{{ tasks().length }}</span>
  </header>

  <div class="column__cards"
       cdkDropList
       [cdkDropListData]="tasks()"
       [cdkDropListConnectedTo]="['backlog', 'todo', 'doing', 'done']"
       [id]="status().toLowerCase()"
       (cdkDropListDropped)="aoSoltar($event)">
    @for (task of tasks(); track task.id) {
      <div cdkDrag>
        <app-task-card [task]="task" (avancar)="avancarTask.emit($event)" />
      </div>
    }
    <button class="column__add">+ Add card</button>
  </div>
</section>
